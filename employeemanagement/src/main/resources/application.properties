spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fullstack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret=${JWT_SECRET:change-this-default-jwt-secret-to-a-long-random-value-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.auth.admin.username=${ADMIN_USERNAME:admin}
app.auth.admin.password=${ADMIN_PASSWORD:admin123}
app.auth.hr.username=${HR_USERNAME:hr}
app.auth.hr.password=${HR_PASSWORD:hr123}
app.auth.employee.username=${EMPLOYEE_USERNAME:employee}
app.auth.employee.password=${EMPLOYEE_PASSWORD:employee123}
